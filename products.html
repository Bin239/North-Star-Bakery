<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Golden Crust Bakery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="./bakery-logo_c.png" alt="Company Logo" class="site-logo">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" aria-current="page">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li>
                      <button type="button" id="cart-toggle-btn" class="nav-cart-btn">
                       🛒 Cart (<span id="cart-count">0</span>)
                      </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="products-header">
            <h1>Our Products</h1>
            <p>Explore our fresh daily baked goods. Visit our shop or pre-order online!</p>
        </section>

        <!-- Category 1: Breads -->
        <section class="product-category">
            <h2>Breads</h2>
            <div class="product-grid" id="breads-grid">
                <!-- Dynamically populated by script.js -->
            </div>
        </section>

        <!-- Category 2: Pastries -->
        <section class="product-category">
            <h2>Pastries</h2>
            <div class="product-grid" id="pastries-grid">
                <!-- Dynamically populated by script.js -->
            </div>
        </section>

        <!-- Category 3: Cakes -->
        <section class="product-category">
            <h2>Cakes</h2>
            <div class="product-grid" id="cakes-grid">
                <!-- Dynamically populated by script.js -->
            </div>
        </section>

        <div class="store-notice">
            <p><strong>Note:</strong> Items are available for in-store pickup only. <a href="contact.html">Pre-order online now!</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Golden Crust Bakery. All rights reserved.</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
